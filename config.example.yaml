# ==============================================================================
# Command Code Go Plugin for CLIProxyAPI - Configuration Example
# ==============================================================================
# 说明：此文件为插件配置模板，请复制为 config.yaml 后根据实际情况修改。
# 切勿将包含真实 API Key 的 config.yaml 提交至 Git 仓库。

# 插件名称或在 CPA 中的标识
plugins:
  commandcode-go:
    # --------------------------------------------------------------------------
    # 凭证与轮询配置 (Credentials & Smooth Weighted Round-Robin Pool)
    # --------------------------------------------------------------------------
    # 多账户轮询池（支持加权轮询调度）
    api_keys:
      - key: "user_your_command_code_api_key_1"
        weight: 1
        label: "account-1"
        disabled: false
      - key: "user_your_command_code_api_key_2"
        weight: 2
        label: "account-2"
        disabled: false

    # 单账户兼容配置（当 api_keys 为空时生效）
    # api_key: "user_your_command_code_api_key"

    # --------------------------------------------------------------------------
    # API 与环境参数 (API & Environment Settings)
    # --------------------------------------------------------------------------
    # Command Code 官方 API 入口，默认为 https://api.commandcode.ai
    base_url: "https://api.commandcode.ai"

    # 模拟 Command Code CLI 客户端版本号（建议与本地安装的官方 CLI 保持一致）
    cli_version: "0.1.34"

    # 项目标识 Slug，附加在请求头 x-project-slug
    project_slug: "cpa-commandcode"

    # 零数据留存标志（Zero Data Retention），为 true 时请求头携带 x-cmd-zdr: 1
    zdr: false

    # 执行信封内部默认工作目录
    working_dir: "."

    # 权限模式配置：default | bypass | restrictive
    permission_mode: "default"

    # --------------------------------------------------------------------------
    # 模型别名映射 (Model Catalog & Aliases)
    # --------------------------------------------------------------------------
    models:
      - alias: "commandcode-go/Qwen/Qwen3.7-Flash"
        name: "Qwen/Qwen3.7-Flash"
        display_name: "Qwen 3.7 Flash"
      - alias: "commandcode-go/claude-3-5-sonnet"
        name: "claude-3-5-sonnet"
        display_name: "Claude 3.5 Sonnet"
      - alias: "commandcode-go/deepseek-r1"
        name: "deepseek-r1"
        display_name: "DeepSeek R1"
